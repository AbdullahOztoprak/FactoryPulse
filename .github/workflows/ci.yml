name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore backend/FactoryPulse.slnx
      - name: Build
        run: dotnet build backend/FactoryPulse.slnx --no-restore -c Release
      - name: Test
        run: dotnet test backend/FactoryPulse.Tests/FactoryPulse.Tests.csproj --no-restore -c Release

  angular:
    name: Frontend build and type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
