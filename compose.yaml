services:
  api:
    build:
      context: .
      dockerfile: backend/FactoryPulse.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      - factorypulse_data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped

volumes:
  factorypulse_data:
